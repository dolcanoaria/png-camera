<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>カメラ解像度検証</title><style>body{font:16px system-ui,sans-serif;max-width:760px;margin:auto;padding:16px;background:#f4f6f8;color:#17212b}section{background:white;padding:14px;border-radius:10px;margin:12px 0}button,select{font:inherit;padding:10px;margin:4px;border:1px solid #aab4bf;border-radius:6px;background:white}button:disabled{opacity:.45}video,img{width:100%;max-height:45vh;object-fit:contain;background:#111}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}a{display:inline-block;padding:10px}h1{font-size:24px}h2{font-size:18px}</style><h1>カメラ解像度検証 v1.0</h1><p>背面カメラの映像と静止画を比較します。通信・位置情報取得は行いません。</p><section><select id="mode"><option value="1920,1080">現行相当 1920×1080</option><option value="2560,1440">2560×1440</option><option value="3840,2160">4K 3840×2160</option><option value="4000,3000">4000×3000</option></select><button id="start">カメラ開始・設定変更</button><button id="stop">停止</button><video id="video" autoplay muted playsinline></video><pre id="status">未起動</pre></section><section><h2>撮影テスト</h2><button id="frame" disabled>映像フレーム JPEG</button><button id="photo" disabled>静止画（既定）</button><button id="maxphoto" disabled>静止画（最大要求）</button><p>比較用：標準カメラで撮った写真を選択</p><input id="file" type="file" accept="image/*"><div id="results"></div></section><section><h2>検証ログ</h2><button id="save">ログ保存</button><pre id="log"></pre></section><script>
'use strict';const $=id=>document.getElementById(id),v=$('video');let stream=null,track=null,ic=null,pc=null,busy=false;const logs=[];function log(s){logs.push(new Date().toISOString()+' '+s);$('log').textContent=logs.join('\n');}function err(e){log(e.name+': '+e.message);$('status').textContent+='\n'+e.name+': '+e.message;}function controls(){for(const id of ['start','stop','mode','file'])$(id).disabled=busy; $('frame').disabled=busy||!track||!v.videoWidth;$('photo').disabled=busy||!ic;$('maxphoto').disabled=busy||!ic||!pc?.imageWidth?.max||!pc?.imageHeight?.max;}function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=track=ic=pc=null;v.srcObject=null;controls();}function save(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),60000);}function run(fn){return async()=>{if(busy)return;busy=true;controls();try{await fn()}catch(e){err(e)}finally{busy=false;controls()}}} $('start').onclick=run(async()=>{stop();$('status').textContent='起動中';if(!navigator.mediaDevices?.getUserMedia)throw new Error('カメラAPIが利用できません。HTTPSで開いてください。');const [width,height]=$('mode').value.split(',').map(Number);log('映像要求 '+width+'×'+height);stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:width},height:{ideal:height}}});track=stream.getVideoTracks()[0];v.srcObject=stream;await v.play();const settings=track.getSettings(),caps=track.getCapabilities?.()||{};log('映像設定 '+JSON.stringify(settings));log('映像能力 '+JSON.stringify(caps));$('status').textContent='実際の映像: '+v.videoWidth+' × '+v.videoHeight+'\n映像能力: '+JSON.stringify({width:caps.width,height:caps.height});if(typeof ImageCapture==='function'){try{ic=new ImageCapture(track);pc=await ic.getPhotoCapabilities();const ranges={imageWidth:pc.imageWidth,imageHeight:pc.imageHeight};log('静止画能力 '+JSON.stringify(ranges));$('status').textContent+='\n静止画能力: '+JSON.stringify(ranges);try{log('静止画設定 '+JSON.stringify(await ic.getPhotoSettings()))}catch(e){log(e.message)}}catch(e){log('静止画能力取得失敗: '+e.message)}}else log('ImageCapture 非対応');});$('stop').onclick=()=>{stop();$('status').textContent='停止しました';};async function result(blob,label,ms){const bitmap=await createImageBitmap(blob);const w=bitmap.width,h=bitmap.height;bitmap.close();const info=`${label}: ${w} × ${h} / ${(w*h/1e6).toFixed(2)} MP / ${Math.round(blob.size/1024)} KiB / ${ms==null?'—':Math.round(ms)+' ms'} / ${blob.type}`;log(info);const div=document.createElement('section'),p=document.createElement('p'),img=document.createElement('img'),a=document.createElement('a');p.textContent=info;const u=URL.createObjectURL(blob);img.src=u;a.href=u;a.download=label.replace(/[^a-zA-Z0-9_-]/g,'_')+'_'+w+'x'+h+'_'+Date.now()+ (blob.type==='image/jpeg'?'.jpg':blob.type==='image/png'?'.png':'.bin');a.textContent='画像保存';div.append(p,img,a);$('results').prepend(div);} $('frame').onclick=run(async()=>{const t=performance.now(),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.95));if(!b)throw new Error('JPEG生成失敗');await result(b,'video-frame',performance.now()-t)});async function photo(max){const t=performance.now();const b=max?await ic.takePhoto({imageWidth:pc.imageWidth.max,imageHeight:pc.imageHeight.max}):await ic.takePhoto();await result(b,max?'photo-max':'photo-default',performance.now()-t)}$('photo').onclick=run(()=>photo(false));$('maxphoto').onclick=run(()=>photo(true));$('file').onchange=run(async()=>{const f=$('file').files[0];if(f)await result(f,'native-camera',null)});$('save').onclick=()=>save(new Blob([logs.join('\n')],{type:'text/plain;charset=utf-8'}),'camera-test-log.txt');addEventListener('pagehide',stop);log('secureContext='+isSecureContext+' / '+navigator.userAgent);
</script></html>
